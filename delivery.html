<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Print From Home - Delivery Partner App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        
        .delivery-header {
            background: #1e293b; padding: 16px 20px; border-bottom: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .delivery-brand { font-size: 1.15rem; font-weight: 800; color: #38bdf8; }
        .delivery-container { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; }

        .auth-box { background: #1e293b; border-radius: 20px; padding: 24px; border: 1px solid #334155; text-align: center; margin-top: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .form-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.95rem; font-weight: 700; outline: none; margin-bottom: 14px; text-align: center; }
        .btn-main { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; text-align: center; }
        .stat-num { font-size: 1.3rem; font-weight: 900; color: #38bdf8; margin-top: 2px; }

        .order-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .order-badge { background: rgba(16,185,129,0.15); color: #10b981; padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; display: inline-block; text-transform: uppercase; }
        .customer-info { background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid #334155; font-size: 0.84rem; line-height: 1.5; }
        .btn-row { display: flex; gap: 8px; }
        .btn-nav { flex: 1; background: #0284c7; color: white; padding: 10px; border-radius: 10px; border: none; font-weight: 700; font-size: 0.82rem; text-decoration: none; text-align: center; display: inline-block; }
        .btn-deliver { flex: 1; background: #10b981; color: white; padding: 10px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.82rem; cursor: pointer; }
        .btn-reject { background: #ef4444; color: white; padding: 10px 16px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.82rem; cursor: pointer; }
    </style>
</head>
<body>

    <header class="delivery-header">
        <div class="delivery-brand">🛵 Delivery Partner App</div>
        <div id="deliveryAgentNameBadge" style="font-size: 0.82rem; font-weight: 700; color: #94a3b8;"></div>
    </header>

    <div class="delivery-container">
        <!-- 1. Real Auth Login Screen -->
        <div id="deliveryAuthScreen" class="auth-box">
            <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;">Delivery Executive Login</h2>
            <p style="font-size: 0.78rem; color: #94a3b8; margin-bottom: 20px;">Enter your registered 10-digit mobile number</p>
            <input type="tel" id="deliveryMobileInput" placeholder="10-digit mobile number" maxlength="10" class="form-input">
            <button type="button" onclick="loginDeliveryExecutive()" class="btn-main">Authenticate & Start</button>
        </div>

        <!-- 2. Dashboard Screen -->
        <div id="deliveryDashboardScreen" style="display: none;">
            
            <!-- Duty Status Toggle Card -->
            <div style="background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="font-size: 0.9rem; font-weight: 800;">Work Duty Status</h4>
                    <p id="dutyStatusSubText" style="font-size: 0.72rem; color: #94a3b8;">You are currently OFFLINE</p>
                </div>
                <button type="button" id="toggleDutyBtn" onclick="toggleRiderDuty()" style="background: #ef4444; color: white; border: none; padding: 8px 18px; border-radius: 10px; font-weight: 800; font-size: 0.82rem; cursor: pointer;">GO ONLINE</button>
            </div>

            <!-- Earnings Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span style="font-size: 0.72rem; font-weight: 700; color: #94a3b8;">TODAY'S EARNINGS</span>
                    <div class="stat-num" id="riderEarningsText">₹0.00</div>
                </div>
                <div class="stat-card">
                    <span style="font-size: 0.72rem; font-weight: 700; color: #94a3b8;">DELIVERIES DONE</span>
                    <div class="stat-num" id="riderCompletedCountText">0</div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 style="font-size: 1.05rem; font-weight: 800;">📦 New & Active Deliveries</h3>
                <button type="button" onclick="fetchRiderDashboard()" style="background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer;">🔄 Refresh</button>
            </div>
            
            <div id="riderOrdersListContainer">
                <p style="text-align: center; color: #94a3b8; padding: 30px;">Go ONLINE above to receive delivery orders.</p>
            </div>
        </div>
    </div>

    <script>
        let currentAgentPhone = localStorage.getItem('delivery_agent_phone') || '';
        let isRiderOnline = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (currentAgentPhone) {
                document.getElementById('deliveryAuthScreen').style.display = 'none';
                document.getElementById('deliveryDashboardScreen').style.display = 'block';
                document.getElementById('deliveryAgentNameBadge').textContent = `Agent: ${currentAgentPhone}`;
                fetchRiderDashboard();
                setInterval(fetchRiderDashboard, 5000);
            }
        });

        // Real Database Auth Login
        async function loginDeliveryExecutive() {
            const phone = document.getElementById('deliveryMobileInput').value.trim();
            if (phone.length !== 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            try {
                const res = await fetch('/api/rider/auth-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();

                if (data.success) {
                    currentAgentPhone = phone;
                    localStorage.setItem('delivery_agent_phone', phone);
                    document.getElementById('deliveryAuthScreen').style.display = 'none';
                    document.getElementById('deliveryDashboardScreen').style.display = 'block';
                    document.getElementById('deliveryAgentNameBadge').textContent = `Agent: ${phone}`;
                    fetchRiderDashboard();
                } else {
                    alert(`⚠️ ${data.message}`);
                }
            } catch (err) {
                alert("❌ Authentication server connection error.");
            }
        }

        // Toggle Duty (Online / Offline)
        async function toggleRiderDuty() {
            isRiderOnline = !isRiderOnline;
            try {
                const res = await fetch('/api/rider/toggle-duty', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: currentAgentPhone, isOnline: isRiderOnline })
                });
                const data = await res.json();
                if (data.success) {
                    isRiderOnline = data.isOnline;
                    updateDutyUI();
                    fetchRiderDashboard();
                }
            } catch (err) {
                alert("❌ Error updating duty status.");
            }
        }

        function updateDutyUI() {
            const btn = document.getElementById('toggleDutyBtn');
            const sub = document.getElementById('dutyStatusSubText');
            if (isRiderOnline) {
                btn.textContent = "GO OFFLINE";
                btn.style.background = "#ef4444";
                sub.textContent = "You are currently ONLINE & active";
                sub.style.color = "#10b981";
            } else {
                btn.textContent = "GO ONLINE";
                btn.style.background = "#10b981";
                sub.textContent = "You are currently OFFLINE";
                sub.style.color = "#94a3b8";
            }
        }

        // Fetch Dashboard Data & Orders
        async function fetchRiderDashboard() {
            if (!currentAgentPhone) return;
            try {
                const res = await fetch(`/api/rider/dashboard/${currentAgentPhone}`);
                const data = await res.json();
                if (!data.success) return;

                // Update Rider stats
                isRiderOnline = data.rider.isOnline;
                updateDutyUI();
                document.getElementById('riderEarningsText').textContent = `₹${(data.rider.earningsToday || 0).toFixed(2)}`;
                document.getElementById('riderCompletedCountText').textContent = data.rider.completedDeliveriesToday || 0;

                const container = document.getElementById('riderOrdersListContainer');
                if (!container) return;

                let htmlContent = '';

                // 1. Show Active Assigned Order if exists
                if (data.activeOrder) {
                    const order = data.activeOrder;
                    htmlContent += `
                        <div class="order-card" style="border-color: #10b981;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="order-badge">Active Order #${order.orderId}</span>
                                <span style="font-size: 0.95rem; font-weight: 900; color: #10b981;">₹${order.totalAmount || order.amount || 0}</span>
                            </div>
                            <div class="customer-info">
                                <p style="font-weight: 800; color: #38bdf8; margin-bottom: 4px;">👤 ${order.customerName} (<a href="tel:${order.phone}" style="color: #38bdf8;">📞 ${order.phone}</a>)</p>
                                <p style="color: #cbd5e1;">📍 <b>Drop Address:</b> ${order.address}</p>
                                <p style="color: #94a3b8; font-size: 0.75rem; margin-top: 4px;">Status: <b>${order.status}</b></p>
                            </div>
                            <div class="btn-row">
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}" target="_blank" class="btn-nav">🗺️ Navigate</a>
                                <button type="button" onclick="markOrderAsDelivered('${order.orderId}')" class="btn-deliver">✅ Complete Delivery</button>
                            </div>
                        </div>
                    `;
                } else if (isRiderOnline && data.newOrders && data.newOrders.length > 0) {
                    // 2. Show New Incoming Orders with Accept / Reject
                    data.newOrders.forEach(order => {
                        htmlContent += `
                            <div class="order-card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="order-badge">New Delivery Request #${order.orderId}</span>
                                    <span style="font-size: 0.95rem; font-weight: 900; color: #38bdf8;">Delivery Earning: ₹25</span>
                                </div>
                                <div class="customer-info">
                                    <p style="color: #cbd5e1;">📍 <b>Pickup:</b> Print From Home Store (Varanasi)</p>
                                    <p style="color: #cbd5e1; margin-top: 4px;">📍 <b>Drop:</b> ${order.address}</p>
                                </div>
                                <div class="btn-row">
                                    <button type="button" onclick="acceptDeliveryOrder('${order.orderId}')" class="btn-deliver" style="background: #3b82f6;">ACCEPT ORDER</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    htmlContent = `<div style="text-align: center; color: #94a3b8; padding: 30px; background: #1e293b; border-radius: 16px;">📭 No orders in queue. Stay online to receive incoming requests!</div>`;
                }

                container.innerHTML = htmlContent;
            } catch (e) {
                console.error("Dashboard fetch error:", e);
            }
        }

        async function acceptDeliveryOrder(orderId) {
            try {
                const res = await fetch('/api/rider/accept-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: currentAgentPhone, orderId })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    fetchRiderDashboard();
                } else {
                    alert(`⚠️ ${data.message}`);
                }
            } catch (err) {
                alert("❌ Connection error accepting order.");
            }
        }

        async function markOrderAsDelivered(orderId) {
            if (!confirm(`Are you sure order #${orderId} has been successfully delivered?`)) return;
            try {
                const res = await fetch('/api/rider/complete-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: currentAgentPhone, orderId })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    fetchRiderDashboard();
                } else {
                    alert("⚠️ Failed to complete delivery.");
                }
            } catch (err) {
                alert("❌ Connection error.");
            }
        }
    </script>
</body>
</html>
