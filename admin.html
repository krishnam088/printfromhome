<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print From Home - Admin Dashboard</title>
    
    <!-- Isolated PWA Manifest for Admin App -->
    <link rel="manifest" href="/manifest-admin.json">
    <meta name="theme-color" content="#0070f3">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #0070f3;
            text-align: center;
        }
        .install-box {
            text-align: center;
            margin-bottom: 20px;
        }
        #btnInstallAdmin {
            display: none;
            padding: 12px 24px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0, 112, 243, 0.4);
            transition: background 0.3s;
        }
        #btnInstallAdmin:hover {
            background: #005bb5;
        }
        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .stat-card {
            background: #2a2a2a;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Print From Home Admin Dashboard</h1>

        <!-- Direct Install App Button Container -->
        <div class="install-box">
            <button id="btnInstallAdmin">📥 Install Admin App</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Live Operations</h3>
                <p id="storeStatusText" style="color: #00ffcc; font-weight: bold;">Checking...</p>
            </div>
            <div class="stat-card">
                <h3>Total Orders</h3>
                <p id="totalOrdersCount" style="font-weight: bold;">0</p>
            </div>
        </div>

        <hr style="border-color: #333; margin: 20px 0;">

        <h2>Active Print Queue & Management</h2>
        <div id="ordersContainer">
            <p>Loading real-time orders...</p>
        </div>
    </div>

    <script>
        let adminDeferredPrompt;
        const btnInstallAdmin = document.getElementById('btnInstallAdmin');

        // Capture PWA install event for Admin Panel
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            adminDeferredPrompt = e;
            if (btnInstallAdmin) {
                btnInstallAdmin.style.display = 'block';
            }
        });

        // Trigger installation on button click
        btnInstallAdmin?.addEventListener('click', () => {
            if (adminDeferredPrompt) {
                adminDeferredPrompt.prompt();
                adminDeferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Admin App Installed Successfully');
                    }
                    adminDeferredPrompt = null;
                });
            }
        });

        // Hide install button once installed
        window.addEventListener('appinstalled', () => {
            if (btnInstallAdmin) {
                btnInstallAdmin.style.display = 'none';
            }
        });

        // Register Isolated Admin Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw-admin.js')
                .then(() => console.log('Admin Service Worker Registered Successfully'))
                .catch((err) => console.log('Admin SW Registration Failed:', err));
        }

        // Fetch basic dashboard data example
        async function fetchAdminData() {
            try {
                const res = await fetch('/api/admin/orders');
                const data = await res.json();
                document.getElementById('totalOrdersCount').innerText = Array.isArray(data) ? data.length : 0;
            } catch (e) {
                console.error("Failed to load admin data");
            }

            try {
                const statusRes = await fetch('/api/store-status');
                const statusData = await statusRes.json();
                document.getElementById('storeStatusText').innerText = statusData.isOpen ? "OPEN" : "CLOSED";
                document.getElementById('storeStatusText').style.color = statusData.isOpen ? "#00ffcc" : "#ff4444";
            } catch (e) {}
        }

        fetchAdminData();
        setInterval(fetchAdminData, 10000); // Refresh every 10s
    </script>
</body>
</html>
