<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintFromHome - Online Document Printing & Delivery</title>
    <link rel="stylesheet" href="style.css">
    <!-- 🔥 FIX 1: Razorpay Integration SDK Script Jodh Di Hai -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <header>
        <div class="logo">PrintFromHome.com</div>
        <p>Your Documents, Printed and Delivered to Your Doorstep</p>
    </header>

    <main class="container">
        <section class="order-section">
            <h2>Configure Your Print Order</h2>
            <form id="printForm" enctype="multipart/form-data">
                
                <!-- 🔥 FIX 2: Saare Inputs Mein name="" Attributes Jodh Diye Hain Taaki Backend Data Padh Sake -->
                <div class="form-group">
                    <label for="fileUpload">Upload Document (PDF preferred):</label>
                    <input type="file" id="fileUpload" name="document" accept=".pdf,.doc,.docx,.png,.jpg" required>
                </div>

                <div class="form-group">
                    <label for="pages">Number of Pages:</label>
                    <input type="number" id="pages" name="pages" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="printType">Print Type:</label>
                    <select id="printType" name="printType">
                        <option value="bw">Black & White (₹2 / page)</option>
                        <option value="color">Full Color (₹10 / page)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sides">Sides:</label>
                    <select id="sides" name="sides">
                        <option value="single">Single Sided</option>
                        <option value="double">Double Sided (Duplex)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="binding">Binding Option:</label>
                    <select id="binding" name="binding">
                        <option value="none">No Binding (Loose Sheets)</option>
                        <option value="staple">Stapled (Free)</option>
                        <option value="spiral">Spiral Binding (+₹30)</option>
                        <option value="soft">Soft Book Binding (+₹50)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter your full hostel, college room, or home address" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Proceed to Payment</button>
            </form>
        </section>

        <section class="summary-section">
            <h2>Order Summary</h2>
            <div class="summary-card">
                <p>Printing Cost: <span id="summaryPrint">₹2.00</span></p>
                <p>Binding Cost: <span id="summaryBinding">₹0.00</span></p>
                <p>Delivery Charges: <span id="summaryDelivery">₹40.00</span></p>
                <hr>
                <h3>Total Amount: <span id="summaryTotal">₹42.00</span></h3>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
